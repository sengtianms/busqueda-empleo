            valor: ['("operations transformation" OR "transformación operacional" OR "transformación operativa" OR "business transformation" OR "transformación empresarial" OR "transformación del negocio" OR "digital transformation" OR "transformación digital" OR "process transformation" OR "transformación de procesos" OR "organizational transformation" OR "transformación organizacional" OR "enterprise transformation" OR "industrial transformation" OR "transformación industrial" OR "change management" OR "gestión del cambio" OR "change manager" OR "gerente de transformación" OR "director de transformación" OR "industry 4.0" OR "smart manufacturing" OR "manufactura inteligente")']
