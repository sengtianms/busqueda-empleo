# --- Capture defaults (Module 1, global) ---
captura:
  max_paginas: 100
  max_ofertas_por_corrida: 1000
  pausa_entre_lotes_segundos: 5
  tope_espera_paginas_sucesivas_segundos: 10
  estrategia_anti_bloqueo: "pausa_aleatoria"

# --- Offer preparation (Module 2, D33) ---
preparacion:
  # Umbrales RapidFuzz de la verificación de duplicidad (0-100):
  # etapa 2 exige título >= umbral_titulo Y descripción >= umbral_descripcion.
  umbral_titulo: 90
  umbral_descripcion: 85
  # Pasadas máximas del bucle de preparación por corrida (>= 1).
  max_pasadas: 2
  # Pausa anti-bloqueo entre ofertas consecutivas (>= 0). D42: la pausa
  # efectiva es aleatoria en [base - jitter, base + jitter] (mas parecida a
  # un humano que un intervalo identico); con jitter 0 queda fija.
  pausa_entre_ofertas_segundos: 1.2
  # Jitter de la pausa anterior (>= 0); 0 desactiva la aleatoriedad.
  pausa_jitter_segundos: 0.4
  # Umbral de similitud (0-100) para fusionar variantes de nombre del mismo
  # lugar antes de crear una fila nueva en `ubicaciones` (D46): mismo pais,
  # ciudad/region comparadas con RapidFuzz; un componente N/A no bloquea.
  # Con 0 se desactiva la fusion (siempre crea fila nueva si no hay igualdad exacta).
  umbral_alias_ubicacion: 90
  # Renovar la sesión httpx de invitado cada N ofertas (>= 1).
  limite_vida_sesion: 50
  # Reintentos por oferta/página (misma estructura que `retries` global).
  retries:
    max_attempts: 3
    base_wait_seconds: 2
    max_wait_seconds: 30
    multiplier: 2

# --- Concurrency (Module 1, lock) ---
concurrencia:
  umbral_obsolescencia_minutos: 120

# --- Batch visibility (tablero + vigilante + mandos; punto 5) ---
visibilidad:
  # Segundos sin señales para considerar detenida la tanda (panel y centinela).
  umbral_congelada_segundos: 600
  # Ventana (segundos) para reconocer que una fila arrancó junto a su tanda.
  ventana_tanda_segundos: 900

# --- Credential storage (D4) ---
almacen_credenciales:
  mecanismo: ".env"
  archivo: "config/.env"
  referencias:
    - "LINKEDIN_EMAIL"
    - "LINKEDIN_PASSWORD"

# --- Initial evaluation (Module 3, 5 controles de veto; ficha M3) ---
evaluacion:
  # Pausa anti-bloqueo entre ofertas consecutivas (>= 0), espejo de Preparación:
  # la pausa efectiva es aleatoria en [base - jitter, base + jitter]; con jitter 0 queda fija.
  pausa_entre_ofertas_segundos: 1.2
  pausa_jitter_segundos: 0.4
  # Espera máxima por puerta (D59): una puerta que no responde en este tiempo
  # se descarta y se pasa de inmediato a la siguiente; las puertas caídas no
  # se reintentan durante la corrida.
  timeout_puerta_segundos: 60
  # Intentos por oferta ante RESPUESTA INVÁLIDA en la misma puerta (ficha M3: 2).
  # Un fallo de puerta no consume intentos: la puerta se descarta (D59).
  retries:
    max_attempts: 2
    base_wait_seconds: 2
    max_wait_seconds: 30
    multiplier: 2
  # Puertas alternas del mismo modelo, en orden (la primera que responde manda).
  # Cada puerta indica su nombre, el modelo en el proveedor y la referencia de
  # su llave; las llaves viven solo en config/.env. Tres puertas OpenRouter
  # con el mismo Gemma 4 31B (D50) — si una falla, la siguiente responde.
  puertas_alternas:
    - nombre: "openrouter-1"
      modelo: "google/gemma-4-31b-it"
      clave_ref: "OPENROUTER_API_KEY_1"
    - nombre: "openrouter-2"
      modelo: "google/gemma-4-31b-it"
      clave_ref: "OPENROUTER_API_KEY_2"
    - nombre: "openrouter-3"
      modelo: "google/gemma-4-31b-it"
      clave_ref: "OPENROUTER_API_KEY_3"

# --- Browser ---
browser:
  headless: true
  timeout_seconds: 30
  # Memoria de sesión de LinkedIn (equipo nuevo tras reinstalar el sistema):
  # tras un único ingreso manual con verificación, LinkedIn reconoce este
  # PC y las corridas siguientes entran directo. Vacío = modo actual sin
  # memoria. Carpeta propia del sistema, nunca el perfil personal.
  profile_path: "data/browser_profile"
  # Ventana normal del Módulo 1 (ancho × alto) con contenido que acompaña;
  # espera máxima del ingreso manual con memoria (segundos).
  ventana_ancho: 1600
  ventana_alto: 900
  espera_manual_segundos: 300

# --- Resiliencia del navegador (D61, 2026-10-22) ---
# La tanda sobrevive a la muerte del navegador y renueva el canal por
# tramos: nada de una tanda viaja a la siguiente, cada tanda termina íntegra
# lo suyo.
descubrimiento:
  # Cargas pesadas de página vividas antes de reconstruir el canal preventivamente
  # (con la misma memoria de sesión y sin interrumpir la tanda).
  renovar_navegador_tras_paginas: 30
  # Muertes consecutivas del navegador sin capturar NINGUNA página antes de
  # declarar el entorno insostenible y cerrar la tanda con veredicto. Con
  # progreso entre medias el contador vuelve a cero: la resurección
  # efectiva no tiene techo.
  tope_muertes_sin_avance: 3

# --- Local AI (Ollama) ---
# Modelo usado por los propósitos enrutados a "local". Hoy solo
# `preparacion` (clasificación de ubicación, Módulo 2) usa esta ruta;
# el tag -cloud corre en servidores de Ollama vía proxy local.
ai_local:
  host: "localhost"
  port: 11434
  model: "gpt-oss:120b-cloud"
  timeout_seconds: 60
  # Muestreo determinista para tareas de clasificación (análisis
  # Pereira 2026-08-25): temperature 0 elimina la varianza entre
  # corridas de la clasificación PRM-006. Sin esta sección, Ollama
  # usa sus defaults (temperature 0.8, muestreo aleatorio).
  options:
    temperature: 0.0

# --- AI Cloud (Ollama Cloud via local proxy) ---
ai_cloud:
  endpoint: "http://localhost:11434"
  model: "gemma4:31b-cloud"
  # Espejo de ai_local.options: muestreo determinista también en la
  # ruta cloud para propósitos de clasificación futuros.
  options:
    temperature: 0.0
  timeout_seconds: 120

# --- AI Routing by Purpose ---
ai_routing:
  evaluation: "cloud"
  processing: "cloud"
  # Clasificación de ubicación del Módulo 2 (D33): usa la ruta local,
  # cuyo modelo es gpt-oss:120b-cloud vía proxy Ollama (D44: swap desde
  # gpt-oss:20b-cloud tras experimento comparado — igual calidad, ~3x
  # más rápido, mejor cobertura para expansión América).
  preparacion: "local"

# --- Persistence ---
persistence:
  data_path: "data"
  db_file: "data/job_search.db"

# --- Logging ---
# Nivel por defecto INFO (corridas rutinarias); para depuración,
# LOG_LEVEL=DEBUG en .env (ver config/.env.template).
logging:
  level: "INFO"
  rotation: "10 MB"
  retention_days: 30
  logs_path: "logs"

# --- Retries (DOC-06) ---
retries:
  max_attempts: 3
  base_wait_seconds: 2
  max_wait_seconds: 30
  multiplier: 2

# --- Transversal orchestrator (scheduled run, ficha D34) ---
orquestador:
  modo_ejecucion: "serie"
  modulos: ["descubrimiento", "preparacion", "evaluacion"]
  pausa_entre_modulos_segundos: 5

# --- Professional Profile (DOC-10) ---
profile:
  tecnologias: {}
  anos_experiencia: 0
  seniority: ""
  idiomas: {}
  ubicaciones_preferidas: []
  modalidades_preferidas: []
  salario_minimo: null
  empresas_objetivo: []
  empresas_excluidas: []
  educacion_nivel: ""
