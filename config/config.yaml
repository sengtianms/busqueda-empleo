# --- Discovered sources (Module 1) ---
fuentes:
  - fuente_id: "linkedin"
    nombre: "LinkedIn"
    ficha_acceso:
      enlace: "https://www.linkedin.com/jobs/search"
      tipo_acceso: "con_autenticacion"
      credenciales_referencia:
        - "LINKEDIN_EMAIL"
        - "LINKEDIN_PASSWORD"
      criterio_exito: "MainFeed"
      timeout_segundos: 30
    # Sets de filtros: una búsqueda por set; todos se ejecutan en la misma
    # corrida (set 0: buscar -> capturar -> registrar -> siguiente set).
    # Regla: indice_set debe ser consecutivo desde 0 (0, 1, 2, ...). Un hueco
    # (p.ej. 0 y 2) aborta la corrida con ERR-01 "Set ausente"; un índice
    # duplicado hace que el segundo set se ignore en silencio.
    #
    # D60 (2026-10-22): matriz geográfica de 4 barridas x 18 grupos
    # temáticos = 72 búsquedas por tanda. Barrida y código oficial de
    # región (geoid): Colombia 100876405 (índices 0-17), América Latina
    # 91000011 (18-35), América del Norte 91000022 (36-53) y Mundo en
    # remoto 92000000 (54-71, además del filtro de modalidad "remoto":
    # LinkedIn lo ancla a las remotas disponibles para trabajar desde
    # Colombia, de empresas de cualquier parte). El orden local-primero
    # es la prioridad ante repetidos (dedup por id_externo). As-built:
    # location=<texto> dejó de honrarse por LinkedIn (2026-10-22); los
    # sets no lo usan, la geografía viaja solo por geoid.
    sets_de_filtros:
      - indice_set: 0   # G01 Excelencia Operacional · Colombia
        filtros:
          - tipo: "keywords"
            valor: ['("excelencia operacional" OR "operational excellence" OR "excelencia operativa" OR OpEx OR "business excellence") AND (líder OR jefe OR coordinador OR gerente OR lead OR manager OR head OR director)']
          - tipo: "geoid"
            valor: "100876405"
          - tipo: "fecha_publicacion"
            valor: "r86400"
      - indice_set: 1   # G02 Mejora Continua · Colombia
        filtros:
          - tipo: "keywords"
            valor: ['("mejora continua" OR "mejoramiento continuo" OR "continuous improvement" OR "Lean Six Sigma" OR "Six Sigma" OR LSS) AND (líder OR jefe OR ingeniero OR lead OR manager OR coordinador OR director) NOT (practicante OR aprendiz OR auxiliar OR intern OR trainee OR junior)']
          - tipo: "geoid"
            valor: "100876405"
          - tipo: "fecha_publicacion"
            valor: "r86400"
      - indice_set: 2   # G03 Transformación Operacional · Colombia
        filtros:
          - tipo: "keywords"
            valor: ['("transformación operacional" OR "transformación operativa" OR "operations transformation" OR "operational transformation" OR "business transformation" OR "process transformation") AND (operaciones OR operations OR procesos OR process) AND (líder OR gerente OR manager OR lead OR director OR head) NOT (ventas OR comercial OR marketing OR sales)']
          - tipo: "geoid"
            valor: "100876405"
          - tipo: "fecha_publicacion"
            valor: "r86400"
      - indice_set: 3   # G04 Optimización de Procesos · Colombia
        filtros:
          - tipo: "keywords"
            valor: ['("optimización de procesos" OR "mejoramiento de procesos" OR "gestión por procesos" OR "process improvement" OR "process excellence" OR "process optimization" OR BPM) AND (líder OR jefe OR gerente OR coordinador OR lead OR manager OR head OR director) NOT (practicante OR aprendiz OR auxiliar OR intern OR junior)']
          - tipo: "geoid"
            valor: "100876405"
          - tipo: "fecha_publicacion"
            valor: "r86400"
      - indice_set: 4   # G05 Manufactura y Lean · Colombia
        filtros:
          - tipo: "keywords"
            valor: ['("ingeniero de procesos" OR "líder de procesos" OR "process engineer" OR "manufacturing excellence" OR "excelencia en manufactura" OR "Lean manufacturing" OR "Lean production" OR "Manufactura esbelta" OR "Lean management") AND (manufactura OR producción OR planta OR manufacturing) AND (gerente OR manager OR líder OR lead OR director OR head OR senior) NOT (practicante OR junior OR intern)']
