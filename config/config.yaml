    # geografía viaja solo por geoid.
    sets_de_filtros:
      - indice_set: 0   # G01 Excelencia operacional, liderazgo de operaciones y servicios · Colombia
        filtros:
          - tipo: "keywords"
            valor: ['("operational excellence" OR "excelencia operacional" OR OpEx OR "business excellence" OR "continuous improvement" OR "mejora continua" OR "operations manager" OR "gerente de operaciones" OR "jefe de operaciones" OR "director de operaciones" OR "head of operations" OR "plant manager" OR "gerente de planta" OR "jefe de planta" OR "production manager" OR "gerente de producción" OR "jefe de producción" OR "capacity planning" OR "planeación de capacidad" OR "operational planning" OR "planeación operativa" OR "resource planning" OR "planeación de recursos" OR "service operations" OR "operaciones de servicio" OR "service delivery" OR "gerente de servicios" OR "director de servicios" OR "gestión de servicios" OR "operational governance" OR "gobierno operacional" OR "gobierno de operaciones")']
          - tipo: "geoid"
            valor: "100876405"
          - tipo: "fecha_publicacion"
            valor: "r86400"
          - tipo: "nivel_experiencia"
            valor: ["Sénior", "Administrador", "Director", "Ejecutivo"]
      - indice_set: 1   # G02 Transformación operacional, digital, industrial y organizacional · Colombia
        filtros:
